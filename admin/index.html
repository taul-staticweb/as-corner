<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - A's Corner</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Quill.js Editor (Snow Theme) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header class="admin-header">
        <h1>Panel Admin</h1>
        <div style="display: flex; gap: 0.5rem;">
            <a href="panduan.html" class="btn-outline">Panduan</a>
            <a href="../index.html" class="btn-outline" target="_blank">Lihat Web</a>
        </div>
    </header>

    <main class="container">
        <!-- Form Section -->
        <section class="card form-section">
            <h2 id="form-title">Tulis Postingan Baru</h2>
            <form id="post-form">
                <input type="hidden" id="post-id">
                <input type="hidden" id="post-action" value="add">
                
                <div class="form-group">
                    <label for="post-tema">Tema / Kategori</label>
                    <input type="text" id="post-tema" placeholder="Contoh: Quotes, Opini, Informasi" required>
                </div>
                
                <div class="form-group">
                    <label for="post-judul">Judul Tulisan</label>
                    <input type="text" id="post-judul" placeholder="Judul..." required>
                </div>
                
                <div class="form-group">
                    <label>Isi Postingan</label>
                    <div id="editor-container"></div>
                </div>
                
                <div class="form-group">
                    <label for="post-foto">URL Foto Utama (Thumbnail)</label>
                    <input type="url" id="post-foto" placeholder="https://...">
                    <small>Gunakan foto yang di-host online (misal: Google Drive publik, Imgur, dll)</small>
                </div>
                
                <div class="form-group">
                    <label for="post-video">URL Video (Youtube)</label>
                    <input type="url" id="post-video" placeholder="https://youtube.com/watch?v=...">
                </div>
                
                <div class="form-group">
                    <label for="post-link">Link Eksternal Tambahan</label>
                    <input type="url" id="post-link" placeholder="https://...">
                </div>
                
                <div class="form-actions">
                    <button type="button" id="btn-cancel" class="btn-secondary" style="display: none;">Batal Edit</button>
                    <button type="submit" id="btn-submit" class="btn-primary">Publikasikan</button>
                </div>
                
                <div id="form-message" class="message"></div>
            </form>
        </section>

        <!-- List Section -->
        <section class="card list-section">
            <h2>Daftar Postingan</h2>
            <div id="loading-list" class="loading">Memuat data...</div>
            <div class="table-responsive">
                <table id="post-table">
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Judul</th>
                            <th>Tema</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="post-tbody">
                        <!-- Data rows dinamis -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="../config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
